<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Tacógrafo Pro · Propietario 3.0.1 A</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f1f5f9;color:#102a43}aside{position:fixed;inset:0 auto 0 0;width:248px;background:#102a43;color:white;padding:20px 12px;overflow:auto}h1,h2,h3,p{margin-top:0}aside h2{font-size:20px;margin:8px}small{color:#64748b}aside small{color:#b9d0e3}nav button{display:flex;gap:12px;align-items:center;width:100%;background:transparent;color:#dce8f4;text-align:left;border:0;padding:12px;border-radius:8px;font:inherit;cursor:pointer}nav button.active,nav button:hover{background:#20577d}main{margin-left:248px;min-height:100vh}header{position:sticky;top:0;background:white;border-bottom:1px solid #dce4ec;padding:15px 24px;display:flex;align-items:center;gap:12px;z-index:2}header strong{flex:1}.badge{background:#fff2d5;color:#785314;padding:7px 10px;border-radius:20px;font-size:12px}article{padding:24px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;border:1px solid #dce4ec;border-radius:14px;padding:20px;margin-bottom:14px}.metric{font-size:32px;font-weight:700;color:#13845a}.muted{color:#64748b}.hero{background:#102a43;color:white}.hero p{color:#c8d9e8}button.primary{background:#087e55;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit;cursor:pointer}button.secondary{background:white;color:#20577d;border:1px solid #b9cbdc;border-radius:8px;padding:11px;font:inherit;cursor:pointer}button.tile{background:white;border:1px solid #dce4ec;border-radius:12px;padding:20px;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:100px}button.tile span{display:block;font-size:24px;margin-bottom:8px}label{display:block;margin:12px 0 6px}input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #b9cbdc;border-radius:8px;font:inherit;background:white;color:#102a43}input[type=checkbox]{width:18px;height:18px;vertical-align:middle;accent-color:#087e55}.check{display:flex;align-items:center;gap:10px;padding:8px 0}.notice{background:#fff7e5;border:1px solid #e7d4a9;border-radius:9px;padding:12px;margin-bottom:16px;color:#74551e}.menu{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.scroll{overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.dark{background:#111d2a;color:#e2e8f0}.dark .card,.dark header,.dark .tile{background:#1d3044;color:#e2e8f0;border-color:#34495e}.dark .muted,.dark small{color:#a9bdd0}footer{padding:20px;text-align:center;color:#64748b}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #32b88b;outline-offset:2px}@media(max-width:1000px){aside{transform:translateX(-100%);z-index:5;transition:transform .2s}aside.open{transform:none}main{margin-left:0}.menu{display:inline-block}article{padding:18px}}@media(max-width:540px){article{padding:12px}header{padding:12px;flex-wrap:wrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card,button.tile{padding:13px}.badge{font-size:11px}h1{font-size:23px}.metric{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><aside id="side"><h2>🚛 Mi Tacógrafo Pro</h2><small>ADMINISTRACIÓN PRIVADA · DEMO</small><hr style="border:0;border-top:1px solid #38546c"><nav id="nav"></nav></aside><main><header><button class="secondary menu" id="menu" aria-label="Abrir menú">☰</button><strong>Panel de Propietario</strong><span class="badge">🔒 Propietario · Demo</span><button class="secondary" id="theme" aria-label="Cambiar tema">◐</button></header><article id="content"></article><footer>Mi Tacógrafo Pro · 3.0.1 A · Prototipo independiente</footer></main><script>
const sections=[['⌂','Inicio'],['♙','Usuarios'],['♟','Mi equipo'],['✉','Invitaciones'],['⚿','Roles y permisos'],['☏','Centro de asistencia'],['▣','Suscripciones'],['▥','Estadísticas'],['€','Finanzas'],['◉','Comunicados'],['▤','Centro de pruebas'],['⛨','Seguridad'],['◷','Auditoría'],['▧','Copias de seguridad'],['⚙','Configuración']];const permissions=['Consultar datos básicos de usuarios','Responder consultas','Gestionar incidencias','Solicitar correcciones','Gestionar suscripciones','Consultar estadísticas','Publicar comunicados','Consultar información económica'];let team=[],audit=[],current='Inicio';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function log(s){audit.unshift(new Date().toLocaleString('es-ES')+' — '+s)}function go(p){current=p;$('side').classList.remove('open');render();window.scrollTo(0,0)}function checks(chosen=[]){return permissions.map((p,i)=>`<label class="check"><input type="checkbox" name="perm" value="${i}" ${chosen.includes(i)?'checked':''}>${p}</label>`).join('')}function selected(){return [...document.querySelectorAll('input[name=perm]:checked')].map(x=>+x.value)}function render(){ $('nav').innerHTML=sections.map(([i,p])=>`<button class="${p===current?'active':''}" data-go="${p}">${i}　${p}</button>`).join('');let h=`<h1>${current==='Inicio'?'Panel de control':current}</h1><div class="notice">Entorno de demostración. Sin autenticación real, sin conexión a Supabase y sin envío de correos. Utiliza únicamente datos ficticios.</div>`;if(current==='Inicio'){h+=`<div class="card hero"><h2>Bienvenido a tu empresa</h2><p>Administra Mi Tacógrafo Pro desde un único lugar.</p></div><div class="grid">${['Usuarios registrados','Por Cuenta Ajena','Autónomos Pro','Empleados internos','Ingresos mensuales','Incidencias abiertas'].map(p=>`<div class="card"><small>${p}</small><div class="metric">${p==='Empleados internos'?team.length:'—'}</div><small>${p==='Empleados internos'?'Registros de prueba':'Sin datos conectados'}</small></div>`).join('')}</div><h2>Administración general</h2><div class="grid">${sections.slice(1).map(([i,p])=>`<button class="tile" data-go="${p}"><span>${i}</span>${p}</button>`).join('')}</div>`}else if(current==='Mi equipo'||current==='Roles y permisos'){h+=`<div class="card"><h2>Equipo interno</h2><p>El rol de propietario está reservado. Los empleados no pueden concederse permisos.</p><button class="primary" data-go="Invitaciones">+ Invitar empleado</button></div>${team.length?team.map((t,i)=>`<div class="card"><h3>${esc(t.name)}</h3><p>${esc(t.email)} · ${esc(t.role)}</p><p>Estado de prueba: ${t.status}</p><div class="actions"><button class="secondary" data-edit="${i}">Editar permisos</button><button class="secondary" data-toggle="${i}">${t.status==='Suspendido'?'Reactivar':'Suspender'}</button></div></div>`).join(''):'<div class="card">No hay empleados de prueba.</div>'}<div id="edit"></div>`}else if(current==='Invitaciones'){h+=`<form class="card" id="invite"><h2>Nueva invitación privada</h2><label for="name">Nombre ficticio</label><input id="name" required><label for="email">Correo de prueba</label><input id="email" type="email" placeholder="empleado@example.com" required><label for="role">Cargo</label><select id="role"><option>Asistencia al cliente</option><option>Soporte técnico</option><option>Administración</option><option>Marketing</option><option>Contabilidad</option></select><h3 style="margin-top:20px">Permisos individuales</h3>${checks()}<p>🔒 Propietario: no asignable</p><button class="primary">Crear invitación simulada</button></form>`}else if(current==='Centro de pruebas'){h+=`<div class="card"><h2>Simulador privado</h2><div class="actions">${['Por Cuenta Ajena','Autónomo Pro','Empleado interno'].map(p=>`<button class="secondary" data-preview="${p}">${p}</button>`).join('')}</div></div><div id="preview"></div>`}else if(current==='Seguridad'){h+=`<div class="card"><h2>Acceso inteligente</h2><p>Correo verificado, contraseña, doble factor y claves de acceso WebAuthn (Face ID, huella o PIN del dispositivo).</p><p class="muted">Pendiente de implementación segura. No se recopilan datos biométricos.</p></div><div class="card"><h3>Control de sesiones y dispositivos</h3><p>Pendiente de conexión al servidor.</p></div>`}else if(current==='Auditoría'){h+=`<div class="card"><h2>Actividad de esta demostración</h2>${audit.length?audit.map(a=>`<p>${esc(a)}</p>`).join(''):'Sin actividad registrada.'}</div>`}else if(current==='Centro de asistencia'){h+=`<div class="grid">${['Pendientes','En proceso','Resueltas','Urgentes'].map(p=>`<div class="card"><small>${p}</small><div class="metric">—</div></div>`).join('')}</div><div class="card"><h2>Tipos de incidencias</h2><p>Acceso · Sincronización · Pagos · Herramientas · Consultas generales</p><small>Pendiente de conexión al sistema de tickets.</small></div>`}else{h+=`<div class="card"><h2>${current}</h2><p>Sección reservada para desarrollo y conexión segura.</p><small>No hay datos reales disponibles.</small></div>`}$('content').innerHTML=h;const f=$('invite');if(f)f.onsubmit=e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase();if(team.some(t=>t.email===email)){alert('Este correo ya existe en la demostración.');return}team.push({name:$('name').value.trim(),email,role:$('role').value,perms:selected(),status:'Invitación simulada'});log('Invitación simulada creada');go('Mi equipo')}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.edit!==undefined){const i=+b.dataset.edit;$('edit').innerHTML=`<div class="card"><h3>Permisos de ${esc(team[i].name)}</h3>${checks(team[i].perms)}<button class="primary" id="save">Guardar cambios de prueba</button></div>`;$('save').onclick=()=>{team[i].perms=selected();log('Permisos de prueba modificados');render()};$('edit').scrollIntoView({block:'nearest'})}if(b.dataset.toggle!==undefined){let t=team[+b.dataset.toggle];t.status=t.status==='Suspendido'?'Invitación simulada':'Suspendido';log('Estado de empleado de prueba modificado');render()}if(b.dataset.preview){let p=b.dataset.preview;let tools=p==='Empleado interno'?['Asistencia al cliente','Incidencias (según permisos)']:['Mis jornadas','Conducción y descansos','Vehículos y kilómetros','Mi calendario','Trabajos extra','Resumen y copias',...(p==='Autónomo Pro'?['Mantenimiento e ITV','Mi Negocio Pro','Rentabilidad por viaje']:[])];$('preview').innerHTML=`<div class="card"><h2>${p}</h2><small>Vista simulada, sin datos reales</small></div><div class="grid">${tools.map(t=>`<div class="card">${t}</div>`).join('')}</div>`}});$('menu').onclick=()=>$('side').classList.toggle('open');$('theme').onclick=()=>document.body.classList.toggle('dark');render();</script></body></html>
